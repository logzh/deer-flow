name: Sync Upstream Repository

on:
  schedule:
    # Temporary verification cadence: run every 10 minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add or update upstream remote
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/bytedance/deer-flow.git
          else
            git remote add upstream https://github.com/bytedance/deer-flow.git
          fi

      - name: Sync upstream/main into origin/main
        run: |
          set -euo pipefail

          git fetch upstream main

          BEFORE_SHA="$(git rev-parse HEAD)"
          UPSTREAM_REF="upstream/main"

          if git merge-base --is-ancestor HEAD "${UPSTREAM_REF}"; then
            echo "Fast-forwarding to ${UPSTREAM_REF}..."
            git merge --ff-only "${UPSTREAM_REF}"
          elif git merge-base --is-ancestor "${UPSTREAM_REF}" HEAD; then
            echo "origin/main is already ahead of ${UPSTREAM_REF}; no merge needed."
          else
            echo "Branches diverged; creating a merge commit from ${UPSTREAM_REF}..."
            git merge --no-ff --no-edit "${UPSTREAM_REF}"
          fi

          AFTER_SHA="$(git rev-parse HEAD)"
          if [ "${BEFORE_SHA}" = "${AFTER_SHA}" ]; then
            echo "No updates to push."
          else
            git push origin main
          fi
