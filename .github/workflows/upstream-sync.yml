name: Sync Upstream Repository

on:
  schedule:
    # GitHub Actions schedule uses UTC. 16:00 UTC = 00:00 (UTC+8) daily.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add or update upstream remote
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/bytedance/deer-flow.git
          else
            git remote add upstream https://github.com/bytedance/deer-flow.git
          fi

      - name: Fetch upstream main
        run: git fetch upstream main

      - name: Fast-forward merge upstream/main
        run: git merge --ff-only upstream/main

      - name: Push changes to origin/main
        run: git push origin main
